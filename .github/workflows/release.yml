name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Opt JavaScript actions (upload/download-artifact, setup-node, gh-release)
# into the Node.js 24 runtime — Node 20 is being removed from runners
# (forced by 2026-06-16). Silences the deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: trs
            artifact: trs-linux-x64
            npm_dir: linux-x64
            npm_bin: trs

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: trs
            artifact: trs-linux-arm64
            npm_dir: linux-arm64
            npm_bin: trs

          - target: x86_64-apple-darwin
            os: macos-latest
            binary: trs
            artifact: trs-darwin-x64
            npm_dir: darwin-x64
            npm_bin: trs

          - target: aarch64-apple-darwin
            os: macos-latest
            binary: trs
            artifact: trs-darwin-arm64
            npm_dir: darwin-arm64
            npm_bin: trs

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: trs.exe
            artifact: trs-windows-x64.exe
            npm_dir: win32-x64
            npm_bin: trs.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.binary }}
          else
            strip target/${{ matrix.target }}/release/${{ matrix.binary }}
          fi

      - name: Rename binary for GitHub Release
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Prepare npm platform package
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} npm/platforms/${{ matrix.npm_dir }}/${{ matrix.npm_bin }}

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v5
        with:
          name: npm-${{ matrix.npm_dir }}
          path: npm/platforms/${{ matrix.npm_dir }}/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Full history + tags so git-cliff can build the changelog/notes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Release body = git-cliff notes for just this tag (Conventional
      # Commits grouped by type). Replaces GitHub's raw PR-list notes.
      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Generate SHA256SUMS
        run: |
          # One sums file covering every published binary so install.sh /
          # install.ps1 can verify the download before chmod +x. Format
          # is `<hex>  <filename>` (two spaces) — what `shasum -a 256`
          # outputs natively when run from the file's own dir.
          #
          # v0.6.3 footgun: piping `sha256sum a/b ...` through
          # `sed 's|.*/||'` looks like it strips the dir prefix, but
          # the greedy `.*` also matched the hash + double-space + dir
          # — published file ended up with names only, no hashes.
          # Hash inside each artifact dir to avoid that path-juggling.
          cd artifacts
          : > SHA256SUMS
          for asset in trs-linux-x64 trs-linux-arm64 trs-darwin-x64 \
                       trs-darwin-arm64 trs-windows-x64.exe; do
            # Subshell does the cd; outer redirect writes to
            # `artifacts/SHA256SUMS` (the outer cwd, not the subshell's).
            (cd "$asset" && sha256sum "$asset") >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/trs-linux-x64/trs-linux-x64
            artifacts/trs-linux-arm64/trs-linux-arm64
            artifacts/trs-darwin-x64/trs-darwin-x64
            artifacts/trs-darwin-arm64/trs-darwin-arm64
            artifacts/trs-windows-x64.exe/trs-windows-x64.exe
            artifacts/SHA256SUMS

  npm-publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing requires the workflow to mint an OIDC token that
    # npm verifies against its allowlist. No NPM_TOKEN secret needed —
    # the publisher identity is the (repo + workflow + ref) tuple.
    # See https://docs.npmjs.com/trusted-publishers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to ≥11.5 (Trusted Publishing + provenance)
        run: npm install -g npm@latest

      - name: Download all npm artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Assemble platform packages
        run: |
          # Copy binaries from artifacts into platform package dirs.
          # Must run BEFORE Sync version — the artifact contains package.json
          # at the old version; syncing after assembly ensures the version
          # update is not overwritten by the cp.
          for dir in darwin-x64 darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            cp -r artifacts/npm-${dir}/* npm/platforms/${dir}/
            chmod +x npm/platforms/${dir}/trs* 2>/dev/null || true
          done

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Update base package version
          cd npm
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            for (const dep in pkg.optionalDependencies) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cd ..

          # Update platform package versions (after assembly so the cp
          # from artifacts doesn't overwrite the bumped package.json).
          for dir in npm/platforms/*/; do
            node -e "
              const pkg = require('./${dir}package.json');
              pkg.version = '$VERSION';
              require('fs').writeFileSync('./${dir}package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Publish platform packages
        # No NODE_AUTH_TOKEN — Trusted Publishing uses the OIDC token
        # implicitly via `npm publish` (npm CLI 11+ detects the runtime).
        # `--provenance` attaches a cryptographic attestation that the
        # tarball was built by this workflow at this commit.
        run: |
          for dir in npm/platforms/*/; do
            echo "Publishing $(basename $dir)..."
            cd "$dir"
            npm publish --access public --provenance || echo "Failed to publish $(basename $dir), continuing..."
            cd -
          done

      - name: Publish base package
        run: |
          cd npm
          npm publish --access public --provenance
