name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review matters: without it, flipping a draft to ready does not
    # re-trigger, so the full matrix would never run for that PR.
    types: [opened, synchronize, reopened, ready_for_review]

# Opt JavaScript actions into the Node.js 24 runtime now. Node 20 is being
# removed from runners (GitHub forces Node 24 by 2026-06-16); this silences the
# deprecation warnings without waiting for each action to ship a node24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A newer push on the same ref makes the older run pointless, cancel it
# instead of letting queued jobs pile up against a limited runner pool.
# main is excluded: those runs gate releases and must complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub-hosted runners only. Test is the real 3-OS gate (macOS and Windows are
# built natively); it runs on main and once a PR is ready for review. Lint is
# cheap, so it also runs on drafts. A Tenki quick tier existed for a while and
# was removed: its pool cancelled the whole run when saturated (2026-09-24).
jobs:
  test:
    name: Test
    # Drafts skip the matrix (Lint still runs). Marking a PR ready runs it,
    # which is what must be green before merge.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        # --no-fail-fast: run every test binary even if one fails, so a single
        # run surfaces the full failure set (esp. while hardening Windows).
        run: cargo test --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings
