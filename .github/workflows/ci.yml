name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review matters: without it, flipping a draft to ready does not
    # re-trigger, so the full matrix would never run for that PR.
    types: [opened, synchronize, reopened, ready_for_review]

# Opt JavaScript actions into the Node.js 24 runtime now. Node 20 is being
# removed from runners (GitHub forces Node 24 by 2026-06-16); this silences the
# deprecation warnings without waiting for each action to ship a node24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A newer push on the same ref makes the older run pointless — cancel it
# instead of letting queued jobs pile up against a limited runner pool.
# main is excluded: those runs gate releases and must complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Two tiers, split across providers on purpose:
#
#   quick  — Tenki, Linux only, runs on EVERY push including drafts. Fast
#            feedback while iterating, and it spreads CI load off GitHub.
#   full   — GitHub-hosted, the real 3-OS gate. Runs on main and once a PR is
#            marked ready for review. macOS and Windows binaries are built
#            natively, so those legs cannot move: Tenki has no Windows runner.
#
# The Linux leg deliberately runs in both tiers. It is free on a public repo,
# and it keeps GitHub as the authoritative verdict if Tenki is unavailable.
jobs:
  quick:
    name: Quick (lint + linux)
    # `small` is the deliberate default, not a fallback. Measured on this
    # workload: small 2m30s, GitHub ubuntu 1m38s, and medium ~3m back when it
    # still ran — two extra cores bought nothing. Medium (4c/8g) sits exactly
    # at the documented Starter cap and stopped being served on 2026-08-06:
    # jobs queued for 10h with no runner and no error, which is worse than a
    # clean failure. Small was assigned a runner in under 25s in the same repo,
    # same minute, so the App connection was never the problem.
    #
    # Dependabot skips this tier: the Tenki pool is 5 concurrent jobs on
    # Starter and shared across repos, so a weekly bump should not take a slot
    # from interactive work. The GitHub-hosted matrix below still gates it.
    if: github.actor != 'dependabot[bot]'
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tenki-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --no-fail-fast

  test:
    name: Test
    # Drafts get the quick tier only. Marking a PR ready runs the full matrix,
    # which is what must be green before merge.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        # --no-fail-fast: run every test binary even if one fails, so a single
        # run surfaces the full failure set (esp. while hardening Windows).
        run: cargo test --no-fail-fast

  lint:
    name: Lint
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings
