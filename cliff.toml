# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md (Keep a Changelog) and release notes from
# Conventional Commits. Regenerate: `git cliff -o CHANGELOG.md`.

[changelog]
header = """
# Changelog

All notable changes to **trs** are documented here.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]\
{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.remote.pr_number and "#" ~ commit.remote.pr_number not in commit.message %} (#{{ commit.remote.pr_number }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Normalize / categorize commit messages.
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "(#${2})" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^ci|^build", group = "<!-- 6 -->CI / Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^release", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->Dependencies" },
  { message = "^chore", skip = true },
  { body = ".*security", group = "<!-- 8 -->Security" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[remote.github]
owner = "dPeluChe"
repo = "trs"
