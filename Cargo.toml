[package]
name = "trs-cli"
version = "0.5.16"
edition = "2021"
description = "Token-reducing shell for AI agents — compact terminal output at 68-99% reduction"
license = "MIT"
repository = "https://github.com/dPeluChe/trs"
homepage = "https://usetrs.dev"
keywords = ["cli", "terminal", "ai", "token-reduction", "parser"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "trs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grep = "0.3"
ignore = "0.4"
regex = "1"
htmd = "0.5"
ureq = { version = "3", features = ["rustls-webpki-roots"] }
toml = "0.8"
time = { version = "0.3", features = ["local-offset"] }
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
